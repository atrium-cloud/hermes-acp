name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from packageManager in package.json. Keep the Node
      # version in step with the release workflow.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      # The bin entry points at dist/index.js; prove it execs after bundling.
      - name: Smoke the bundle
        run: node dist/index.js --version
      # The release artifact is built the same way on a tag; a packaging break
      # fails a PR, not a release.
      - name: Package the release artifact
        run: pnpm run package
