name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the Bun that wrote bun.lock. Keep in step with the
          # release workflow.
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # The bin entry points at dist/index.js; prove it execs after bundling.
      - name: Smoke the bundle
        run: node dist/index.js --version
      # The release artifact is built the same way on a tag; a packaging break
      # fails a PR, not a release.
      - name: Package the release artifact
        run: bun run package
