name: Release

# A version tag pushed by `scripts/release.sh --push` cuts a release: this
# compiles the six adapter binaries and attaches them to a GitHub Release for
# the tag. workflow_dispatch re-runs the build against an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and release
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # Gate the release on a green tree so a bad tag never ships.
      - run: bun run typecheck
      - run: bun run test
      - name: Compile binaries
        run: bun run bundle:all
      - name: Zip binaries
        run: bun run package:all
      - name: Create GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/bin/*.zip
          generate_release_notes: true
          # Fail loudly rather than publishing a release missing a platform.
          fail_on_unmatched_files: true
