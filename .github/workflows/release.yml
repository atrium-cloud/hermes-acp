name: Release

# A version tag pushed by `scripts/release.sh --push` cuts a release: this
# builds the adapter bundle, zips it with LICENSE and NOTICE, and attaches the
# zip to a GitHub Release for the tag. workflow_dispatch re-runs the build
# against an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and release
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Gate the release on a green tree so a bad tag never ships.
      - run: bun run typecheck
      - run: bun run test
      # Every tag is paired with its curated changelog committed at the tag;
      # a missing file fails the release rather than shipping generic notes.
      - name: Check the changelog exists
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: test -f "docs/changelogs/${RELEASE_TAG}.md"
      - name: Build and zip the bundle
        run: bun run package
      # Called directly: the hashbang and the executable bit are part of the artifact.
      - name: Smoke the packaged executable
        run: ./dist/hermes-agent-acp --version
      - name: Create GitHub Release with the bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/hermes-agent-acp.zip
          # Curated changelog as the body, generated commit notes appended below.
          body_path: docs/changelogs/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}.md
          generate_release_notes: true
          # Fail loudly rather than publishing a release with no artifact.
          fail_on_unmatched_files: true
